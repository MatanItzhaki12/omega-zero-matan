name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs it too, so nothing is released that fails it
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push to main that names a version with no release yet starts release.yml too, which runs
  # these same checks before it releases anything: this run then leaves them to it, rather than
  # run the tests twice over. Run from release.yml, or on anything else, they all run.
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - name: Leave a release's checks to release.yml
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          run=true
          # called from release.yml, the workflow is release's: only ci's own run on a push
          if [ "$GITHUB_WORKFLOW" = ci ] && [ "$GITHUB_EVENT_NAME" = push ] &&
            [ "$GITHUB_REF" = refs/heads/main ]; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/omega-zero/Cargo.toml | head -1)"
            # as release.yml decides: a version with no release yet is released, checks first
            if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              run=false
              echo "::notice::v$version is being released: release.yml runs the checks"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  lint:
    name: fmt and device clippy
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # the packages fetched, kept so a run whose mirrors cannot be reached installs from here
      - uses: actions/cache@v6
        with:
          path: /var/tmp/apt-debs
          key: apt-${{ runner.os }}-${{ runner.arch }}-lint-v1
          # a job with none of its own takes another's: the tests' hold every package
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the host build's system libraries
        run: sh scripts/ci-apt.sh libasound2-dev libudev-dev pkg-config

      - name: Install the pinned toolchain
        run: for i in 1 2 3 4; do rustup toolchain install && exit 0; sleep $((i * 15)); done; exit 1

      # pinned to the commit v2 named when it was pinned: a tag can be moved, a commit cannot
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy, device
        run: cargo clippy -p omega-zero --no-default-features --features device -- -D warnings

  test:
    name: tests
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # The render tests draw through Mesa's surfaceless EGL, on its software renderer: no GPU, no
    # display, and a runner that is always there to be had.
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v7

      # the packages fetched, kept so a run whose mirrors cannot be reached installs from here
      - uses: actions/cache@v6
        with:
          path: /var/tmp/apt-debs
          key: apt-${{ runner.os }}-${{ runner.arch }}-test-v1
          # a job with none of its own takes another's: the tests' hold every package
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the host build's system libraries and Mesa
        run: |
          sh scripts/ci-apt.sh libasound2-dev libudev-dev pkg-config \
            libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Install the pinned toolchain
        run: for i in 1 2 3 4; do rustup toolchain install && exit 0; sleep $((i * 15)); done; exit 1

      # pinned to the commit v2 named when it was pinned: a tag can be moved, a commit cannot
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Where the render tests and the screens example find their headless GL.
      - name: Clippy, host
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Each failing test, and where it panicked, is also written as an error annotation: the
      # run's page lists them, and GitHub's API gives them to anyone, signed in or not.
      - name: Test
        shell: bash
        run: |
          # the step's shell stops at the first failure: the tests' own is kept, and given last
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # one annotation for them all, its lines joined as an annotation takes them
          failed=$( { grep -E "^test .* FAILED$|^error(\[|:)" test.log; grep -A4 "panicked at" test.log; } | grep -v "^--$" | head -120 | awk 'BEGIN { ORS = "%0A" } { print }' ) || true
          [ -z "$failed" ] || echo "::error title=Failing tests::$failed"
          exit "$status"

      - name: Test on the 640x480 canvas
        if: success() || failure()
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test-640.log
          status=${PIPESTATUS[0]}
          # one annotation for them all, its lines joined as an annotation takes them
          failed=$( { grep -E "^test .* FAILED$|^error(\[|:)" test-640.log; grep -A4 "panicked at" test-640.log; } | grep -v "^--$" | head -120 | awk 'BEGIN { ORS = "%0A" } { print }' ) || true
          [ -z "$failed" ] || echo "::error title=Failing tests::640x480: $failed"
          exit "$status"
        env:
          OMEGA_CANVAS: 640x480

  card:
    name: card scripts
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # Ubuntu's /bin/sh is dash, which keeps the scripts honest about POSIX.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Test the scripts omega-zero ships on the card
        run: for t in card/test-*.sh; do sh "$t"; done
