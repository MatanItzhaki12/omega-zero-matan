name: sim

# The frontend run off screen on an Arm runner, near the H700 the handheld has: four cores,
# each held to a share of its time, as scripts/sim.sh runs it. Its frames and its log are kept
# as the run's artifact. Run by hand from the Actions page or the API, and on a push that changes
# the run itself.
on:
  push:
    paths:
      - scripts/sim.sh
      - scripts/sim/**
      - scripts/ci-apt.sh
      - .github/workflows/sim.yml
  workflow_dispatch:
    inputs:
      script:
        description: The button script, under scripts/sim/
        default: umd-insert.txt
      quota:
        description: Each core's share of its time, as systemd's CPUQuota takes it
        default: 140%

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      # the packages fetched, kept so a run whose mirrors cannot be reached installs from here
      - uses: actions/cache@v6
        with:
          path: /var/tmp/apt-debs
          key: apt-${{ runner.os }}-${{ runner.arch }}-sim-v1
          # a job with none of its own takes another's: the tests' hold every package
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-

      - name: Install the host build's system libraries and Mesa
        run: |
          sh scripts/ci-apt.sh libasound2-dev libudev-dev pkg-config \
            libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Install the pinned toolchain
        run: for i in 1 2 3 4; do rustup toolchain install && exit 0; sleep $((i * 15)); done; exit 1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run the frontend off screen
        run: |
          SIM_CPUS=4 SIM_QUOTA="${{ inputs.quota || '140%' }}" \
            sh scripts/sim.sh "scripts/sim/${{ inputs.script || 'umd-insert.txt' }}" target/sim

      - uses: actions/upload-artifact@v7
        with:
          name: sim
          path: target/sim
