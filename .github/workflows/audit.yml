name: audit

# The crates in Cargo.lock checked against RustSec's advisories: on a change to the lock file,
# and once a week for advisories published since. An advisory for a crate omega-zero-matan uses
# fails the run, and the run's page says which and what to move to.
on:
  push:
    paths: [Cargo.lock, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.lock]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # the newest cargo-audit, cached a week at a time: an older one cannot read the advisories
      # RustSec writes in a newer form, and fails on the database rather than on the crates
      - id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ steps.week.outputs.week }}

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      - name: Audit the lock file
        run: cargo audit --deny warnings
