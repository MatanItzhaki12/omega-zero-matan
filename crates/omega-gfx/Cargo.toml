[package]
name = "omega-gfx"
version = "2.6.8"
description = "omega-zero's renderer: OpenGL ES 2 on the H700, in a window, or headless for tests"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["host"]
host = ["dep:glutin", "dep:glutin-winit", "dep:winit", "dep:raw-window-handle"]
device = []
test-support = []

[dependencies]
gl = { workspace = true }
libloading = { workspace = true }
glutin = { workspace = true, optional = true }
glutin-winit = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[lints]
workspace = true
