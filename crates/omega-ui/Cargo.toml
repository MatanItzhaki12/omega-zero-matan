[package]
name = "omega-ui"
version = "2.7.3"
description = "omega-zero's interface: the shelf, the menus and the UI kit they are drawn in"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
fontdue = { workspace = true }
png = { workspace = true }
resvg = { workspace = true }
usvg = { workspace = true }
omega-gfx = { path = "../omega-gfx", default-features = false }
omega-power = { path = "../omega-power" }
omega-store = { path = "../omega-store" }

[dev-dependencies]
omega-gfx = { path = "../omega-gfx", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
