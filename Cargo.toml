[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"

# One set of lints for every crate, each of which takes them with `[lints] workspace = true`:
# no leftover debugging and no unfinished stubs. (`unsafe_op_in_unsafe_fn`, the 2024 edition's
# default, is for the move to that edition: the libretro host's callbacks need their blocks
# first.)
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[workspace.dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
png = "0.17"
fontdue = "0.9"
libloading = "0.8"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
gl = "0.14"
cpal = "0.15"
gilrs = "0.11"
tempfile = "3"
unicode-normalization = "0.1"
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }
# Save Backup's client for a NAS's Samba shares: pure Rust, run on a thread of its own.
smb2 = "0.39"

# Dependencies build once and then sit still, so the debug build and the tests run them
# optimised: png, lz4 and the font and svg rasterisers are most of what the render tests spend.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.device]
inherits = "release"
lto = "fat"
codegen-units = 1

# For trying a change on the console: optimised like a release, built incrementally and without
# the whole-program pass, so a rebuild takes seconds rather than half a minute.
[profile.device-dev]
inherits = "release"
incremental = true
