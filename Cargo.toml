[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"

# One set of lints for every crate, each of which takes them with `[lints] workspace = true`:
# no leftover debugging and no unfinished stubs. (`unsafe_op_in_unsafe_fn`, the 2024 edition's
# default, is for the move to that edition: the libretro host's callbacks need their blocks
# first.)
[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Work done for nothing on a handheld's four small cores: a copy never used, a default built
# when it is not taken, a collection made only to be walked, a string grown a format at a time.
redundant_clone = "warn"
or_fun_call = "warn"
needless_collect = "warn"
format_push_string = "warn"
format_collect = "warn"
assigning_clones = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
stable_sort_primitive = "warn"
# What can go wrong at the edges: an Instant taken from another that can panic, a midpoint
# that can overflow, a test left ignored with no word why.
unchecked_time_subtraction = "warn"
manual_midpoint = "warn"
ignore_without_reason = "warn"
# Read the way the rest is written.
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
map_unwrap_or = "warn"
unnested_or_patterns = "warn"
explicit_iter_loop = "warn"
ignored_unit_patterns = "warn"
needless_raw_string_hashes = "warn"
range_plus_one = "warn"
equatable_if_let = "warn"
flat_map_option = "warn"
needless_for_each = "warn"

[workspace.dependencies]
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
png = "0.17"
fontdue = "0.9"
libloading = "0.8"
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
gl = "0.14"
cpal = "0.15"
gilrs = "0.11"
tempfile = "3"
unicode-normalization = "0.1"
resvg = { version = "0.48", default-features = false }
usvg = { version = "0.48", default-features = false }
# Save Backup's client for a NAS's Samba shares: pure Rust, run on a thread of its own.
smb2 = "0.39"

# Dependencies build once and then sit still, so the debug build and the tests run them
# optimised: png, lz4 and the font and svg rasterisers are most of what the render tests spend.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.device]
inherits = "release"
lto = "fat"
codegen-units = 1

# For trying a change on the console: optimised like a release, built incrementally and without
# the whole-program pass, so a rebuild takes seconds rather than half a minute.
[profile.device-dev]
inherits = "release"
incremental = true
